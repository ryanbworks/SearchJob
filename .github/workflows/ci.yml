name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Servidor (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes (pytest)
        run: pytest -q

  extension:
    name: Extensão (Firefox)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Testes (node:test)
        run: node --test tests/*.test.js
      - name: Lint (web-ext)
        run: npx --yes web-ext@8 lint --source-dir . --ignore-files tests package.json README.md

  docker:
    name: Build e scan da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build -t searchjob:ci server
      - name: Escanear vulnerabilidades com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: searchjob:ci
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

